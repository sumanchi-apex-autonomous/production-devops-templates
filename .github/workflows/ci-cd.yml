name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-lint:
    name: DevOps Template Validation & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python for YAML Validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate YAML Configurations
        run: |
          python -c "
          import glob, yaml, sys
          errs = 0
          for yf in glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True):
              try:
                  list(yaml.safe_load_all(open(yf, 'r', encoding='utf-8')))
                  print(f'VALID YAML: {yf}')
              except Exception as e:
                  print(f'INVALID YAML: {yf}: {e}', file=sys.stderr)
                  errs += 1
          if errs:
              sys.exit(1)
          "

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet || docker-compose config --quiet
          echo "Docker compose configuration is valid."

      - name: Validate Dockerfile Syntax
        run: |
          docker build --target base -t template-base:test . || docker build -t template:test .
          echo "Dockerfile build verification passed."

      - name: Audit Node Dependencies (if present)
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run lint --if-present
          npm audit --audit-level=high

  container-security-scan:
    name: Container Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: validate-and-lint
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Local Container Image
        run: docker build -t local-test-image:scan .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-test-image:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  publish-verification:
    name: Release & Template Packaging Verification
    runs-on: ubuntu-latest
    needs: container-security-scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Distribution Artefacts
        run: |
          test -f docker-compose.yml || exit 1
          test -f Dockerfile || exit 1
          test -f README.md || exit 1
          test -f .env.example || exit 1
          echo "All production templates verified for release."
